# Zuordnung der logischen Modulnamen auf Pfade und Kistennamen.
#
# IMP-STM-001 Kapitel 3 hält ausdrücklich fest, die Modulnamen seien „logisch,
# nicht als Pfade zu lesen" — sie gelten unter Weg A wie unter Weg B. Ein
# Prüfskript, das Pfade fest kodiert, entschiede damit die offene Wegwahl.
# Deshalb steht die Zuordnung hier als Angabe im Baum und nicht im Skript.
#
# Diese Datei entscheidet **keinen** offenen Punkt: Sie sagt, wo etwas liegt,
# nicht womit es gebaut wird. Unter einem anderen Weg bekommt sie andere Werte,
# das Skript bleibt unverändert.
#
# Fehlt eine Angabe, entfällt die zugehörige Prüfung (S3). Fehlt die Datei
# ganz, während ein Quellbaum vorhanden ist, blockiert die Prüfung — ein
# Quellbaum ohne Zuordnung ist kein geprüfter Quellbaum.

# Oberflächenschicht — hier gilt D-05 (kein Farb-, Schrift- oder Abstandswert
# außerhalb der Gestaltungsquelle) und Schnittregel 1.
oberflaeche = crates/ui

# Die Kiste der Datenhaltung. Die Oberfläche darf sie nicht kennen
# (SM-SEC-004, Schnittregel 1).
datenhaltung = kern-db

# Datenbanktreiber. Die Oberfläche darf keinen davon unmittelbar nennen: Sie
# spricht ausschließlich über die Fassade (SM-SEC-004, Schnittregel 1). Der
# Name der Fassade allein genügt als Prüfung nicht — ein Bauteil, das statt
# dessen den Treiber zieht, umgeht sie genauso.
treiber = rusqlite sqlite3 QSqlDatabase QSqlQuery libsqlite3_sys

# Pfade, in denen Abfragen entstehen (SM-SEC-005).
abfragen = crates
