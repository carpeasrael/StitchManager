# Zuordnung für das Messwerkzeug `scripts/check-hintergrund.sh` (SM-NFR-002).
#
# **Eigene Datei, nicht `.projektregeln.conf`.** Das Messwerkzeug steht
# bewusst außerhalb des Gates und kommt mit der Oberfläche in den Baum; seine
# Schlüssel gehören deshalb in dieselbe Auslieferung. Eine Zuordnungsdatei, die
# auf ein Werkzeug zeigt, das im selben Commit fehlt, ist ein toter Verweis —
# genau der Mangel, wegen dessen dieser Änderungssatz geteilt wurde.
#
# **Diese Datei trägt ausführbaren Inhalt.** `bau_befehl` und
# `pruefbestand_befehl` sind vollständige Befehlszeilen. Das Werkzeug prüft das
# erste Wort gegen eine Positivliste und den Rest gegen ein enges Zeichenraster,
# bevor es sie ausführt.

# Die gebaute Anwendung und der Befehl, der sie erzeugt. Wegabhängig — unter
# einem anderen Oberflächenweg stehen hier andere Werte, die Skripte bleiben
# unverändert. Genutzt vom Messwerkzeug `scripts/check-hintergrund.sh`.
anwendung = target/release/stitchmanager
bau_befehl = cargo build --release -q -p ui
pruefbestand_befehl = cargo run --release -q -p kern-parsers --example erzeuge_bestand
