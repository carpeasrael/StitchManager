# Positivliste der Abhängigkeitskette (npm) — SM-OSS-009, SM-OSS-011.
#
# **Warum diese Datei und nicht das Skript.** Die Liste stand als Literal in
# `scripts/check-docs.sh`. Damit lag dieselbe Frage zweimal im Baum — der
# Rust-Zweig beantwortet sie in `deny.toml` — und eine begründete Ausnahme
# hätte eine Änderung an der Prüflogik verlangt. CLAUDE.md Abschnitt 11 sagt:
# „Die Positivliste wird erweitert, indem die Lizenz geprüft und der Eintrag
# begründet wird — nie, indem die Prüfung gelockert wird."
#
# Je Zeile eine SPDX-Kennung, danach `#` und die Begründung. Zusammengesetzte
# Ausdrücke (`(MIT OR CC0-1.0)`, `Apache-2.0 WITH LLVM-exception`) werden vom
# Prüfer zerlegt: Bei `OR` genügt **ein** zulässiger Teil, bei `AND` müssen
# **alle** zulässig sein.
#
# Diese Datei geht in die Gate-Signatur ein — wer sie ändert, bekommt kein
# altes Ergebnis aus dem Cache.

MIT             # Permissiv, GPL-3.0-verträglich.
ISC             # Funktional MIT-gleich, von der FSF als verträglich geführt.
BSD-2-Clause    # Permissiv, ohne Werbeklausel.
BSD-3-Clause    # Permissiv, ohne Werbeklausel.
Apache-2.0      # GPL-3.0-verträglich (nicht mit GPL-2.0 — die gilt hier nicht).
Python-2.0      # Von der FSF ausdrücklich als GPL-verträglich geführt.
0BSD            # Permissiv, ohne Bedingungen.
Unlicense       # Gemeinfreiheitsverzicht.
CC0-1.0         # Gemeinfreiheitsverzicht.
BlueOak-1.0.0   # Permissiv, vom Blue Oak Council geprüfte Fassung.

# ── Begründete Herkunfts-Ausnahmen ──────────────────────────────────────────
#
# Form: `herkunft <paketpfad>  # <Grund>`. Die Begründung ist Pflicht; eine
# nackte Zeile blockiert. Ohne diese Möglichkeit hätte die Herkunftsprüfung
# keinen begehbaren Weg (S1) — wer hinter einer Firmenspiegelung arbeitet oder
# ein Lockfile älterer Fassung im Baum hat, käme sonst nur über den
# Notfall-Ausstieg weiter.
#
# Der Regelweg bleibt: Lockfile mit
# `npm install --package-lock-only` gegen registry.npmjs.org neu erzeugen.
# Derzeit ist keine Ausnahme eingetragen.
