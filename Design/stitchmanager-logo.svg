  <style>
    .name { font: 600 68px "Josefin Sans", "Avenir Next", "Century Gothic", sans-serif; letter-spacing: 1px; }
    .tagline { font: 400 20px Lato, "Helvetica Neue", sans-serif; letter-spacing: 2px; }
    .ink { fill: #2e2a27; }
