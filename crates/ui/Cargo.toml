[package]
name = "ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "stitchmanager"
path = "src/main.rs"

# Bewusst **ohne** kern-db: Die Oberfläche erreicht die Datenhaltung
# ausschließlich über kern-fassade (SM-SEC-004, Schnittregel 1). Der Verbund
# erzwingt die Regel damit beim Bau statt in einer Sichtprüfung.
[dependencies]
kern-typen.workspace = true
kern-fassade.workspace = true
kern-services.workspace = true
kern-render.workspace = true
log.workspace = true
cxx = "1"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = "0.7"
