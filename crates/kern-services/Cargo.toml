[dev-dependencies]
kern-parsers.workspace = true
# Die Prüffälle legen ihren Bestand über den Schreibpfad an; der nimmt ein
# `Schreibziel` entgegen, nie einen rohen Pfad (SM-SEC-001 bis 003). Ohne diese
# Abhängigkeit lässt sich in den Prüffällen kein geprüftes Ziel bilden.
kern-security.workspace = true
tempfile = "3"
